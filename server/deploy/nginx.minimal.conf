# nginx for the MINIMAL self-hosted client.
#
# Differs from the test host on one decisive point: every backend route goes to THIS install's own
# proxy service (`proxy`, resolved on the compose network), never to somebody else's. The test
# deployment reuses the production backend on purpose — it exists to exercise a CLIENT change — but
# a self-hoster has no production to borrow, and a config that quietly depended on one would work
# on the machine it was written on and nowhere else.
#
# 🚨 COOP/COEP ON EVERY LOCATION THAT DECLARES ANY add_header.
# nginx does not inherit add_header into a block that sets one of its own, so a block that adds
# caching and forgets these two silently drops cross-origin isolation. No isolation means no
# SharedArrayBuffer, and the multi-thread WASM runtime then hangs at boot with nothing useful in
# the console. The main stack shipped 37 of 50 blocks in that state before it was measured, which
# is why this is repeated rather than centralised: a snippet cannot be included here, because this
# file is bind-mounted as a SINGLE FILE and a sibling would not exist inside the container.

upstream uo_backend { server proxy:3000; }

# 🚨 RATE LIMITS, MIRRORED FROM PRODUCTION. The published stack shipped with none of these while
# production carried nineteen — so a self-hoster exposing this to the internet got a slower, more
# open version of the same service. The WebSocket relay was never the gap: the shared proxy caps
# sessions per IP and holds a global ceiling in code. The HTTP surface was, and /auth/guest is the
# one that matters — every call mints a guest session, which becomes an account on the shard and a
# settings file on disk. Each request is size-capped already, so what was missing is a limit on
# FREQUENCY, not on volume.
#
# ⚠️ auth_zone, api_zone, batch_zone and ws_per_ip are NOT declared here: they live in
# nginx.main.conf, which this image copies unchanged from the same source production uses. Only the
# gamefiles pair is declared at this level, exactly as production does it in nginx.conf — a second
# declaration of an existing zone is a startup error, not a duplicate.
limit_req_zone  $binary_remote_addr zone=gamefiles_zone:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=gamefiles_conn:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 24m;   # profile upload (gzipped tar) is the largest legitimate body

    # ── Optional second client at /tuo/ ──────────────────────────────────────
    # This repository ships source for BOTH forks, so a self-hoster can serve TazUO alongside
    # ClassicUO. The two bundles differ only in the compiled assembly — the web layer under
    # minimal-www is the same file for both — so this block is a document root swap and nothing more.
    #
    # ⚠️ It is inert unless the directory exists: no /tuo/ bundle, no route, and the rest of the site
    # is unaffected. The never-cached files are re-declared here because they must stay never-cached
    # for THIS bundle too — index.html carries its own SRI manifest, pinned to the TazUO assembly
    # names, and serving a stale one points the browser at assets that do not exist.
    #
    # 🚨 THE LIST MUST MATCH THE ONE THE ROOT DECLARES, AND minimal-boot.js WAS MISSING FROM IT. The
    # root gives that file its own `location =` with no-store; here it fell through to the catch-all
    # and was served max-age=86400, so Cloudflare held it for a day. It is the ONE file in the boot
    # chain with no fingerprint in its name, and it owns the stored client preference: a player on
    # /tuo/ ran a day-old copy, main.js found no accessor, and pressing Play never handed off to
    # ClassicUO. Measured on the live site — /minimal-boot.js answered BYPASS while
    # /tuo/minimal-boot.js answered HIT. Nothing errors, so the only symptom is "it ignored the
    # client I picked, sometimes".
    location ^~ /tuo/ {
        alias /usr/share/nginx/html-tuo/;
        index index.html;
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Referrer-Policy              strict-origin-when-cross-origin always;
        brotli_static on;
        # =404, never a SPA fallback — same reasoning as the main bundle: a fallback turns a MISSING
        # asset into a 200 serving HTML, and the loader then fails far from the real cause.
        try_files $uri $uri/ =404;

        location ~ ^/tuo/(index\.html|config\.json|minimal-boot\.js)$ {
            alias /usr/share/nginx/html-tuo/$1;
            add_header Cross-Origin-Opener-Policy   same-origin always;
            add_header X-Frame-Options           "DENY"                                 always;
            add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header X-Content-Type-Options       nosniff always;
            add_header Cache-Control                "no-store" always;
        }
        # nginx has no .mjs type, so without this the .NET worker module is served as
        # application/octet-stream and the browser refuses it. `types` REPLACES the inherited table,
        # hence a .mjs-only block. $1 is the capture: nginx has no $0.
        location ~ ^/tuo/(.+\.mjs)$ {
            types { application/javascript mjs; }
            alias /usr/share/nginx/html-tuo/$1;
            add_header Cross-Origin-Opener-Policy   same-origin always;
            add_header X-Frame-Options           "DENY"                                 always;
            add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header X-Content-Type-Options       nosniff always;
            brotli_static on;
        }
    }

    # ── Never-cached: the two files that decide what this install IS ──────────
    # index.html carries the SRI manifest for the fingerprinted bundle, so a stale copy pins the
    # browser to assets that no longer exist. config.json is the file the operator edits; caching
    # it would make "edit config.json and reload" untrue.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Referrer-Policy              strict-origin-when-cross-origin always;
        add_header Cache-Control                "no-store" always;
    }

    location = /config.json {
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Cache-Control                "no-store" always;
        default_type application/json;
    }

    location = /minimal-boot.js {
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Cache-Control                "no-store" always;
    }

    # ── Game files ────────────────────────────────────────────────────────────
    # Brotli is a BANDWIDTH win, not a correctness requirement -- measured 2026-08-19, and the
    # comment that stood here said the opposite. The loader requests each file BY NAME; brotli_static
    # answers with the .br twin when one exists and with the raw file when it does not, so an install
    # that never ran precompress-gamefiles.mjs still boots, just heavier over the wire.
    # (The .br fallback in main.js fires only for an EXTERNAL gamefiles base, which this is not.)
    #
    # 🚨 SERVED FROM DISK, NEVER PROXIED. This block used to proxy_pass to uo_backend, and three
    # files then disagreed about who serves game files: minimalServer.ts says "not here, nginx does",
    # this block forwarded them to minimalServer anyway, and the compose file gave nginx no gamefiles
    # mount at all. The answer was NOBODY — a published stack that could not boot a client, with the
    # symptom being an endless loading screen rather than an error.
    #
    # It went unnoticed because the test deployment proxied /gamefiles/ to the PRODUCTION proxy,
    # which does serve them. A deployment that borrows the thing under test cannot test it.
    #
    # brotli_static only works on a filesystem lookup, so it was inert next to proxy_pass — the very
    # line the comment above calls non-optional was doing nothing.
    location /gamefiles/ {
        # Production applies these to every gamefile route it serves (pool, MapsCache, per-shard).
        limit_req  zone=gamefiles_zone burst=200 nodelay;
        limit_conn gamefiles_conn 16;
        alias /gamefiles/;
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Cache-Control                "public, max-age=31536000, immutable" always;
        brotli_static on;
        # Dotfiles only. NESTED PATHS ARE LEGITIMATE and this guard used to forbid them, which broke
        # the client on its first real boot: it asks for music/digital/config.txt, and a leaf-only
        # rule 404s a file that is right there on disk. Traversal is already handled before this
        # point -- nginx normalises the URI before choosing a location, so ../ never reaches here.
        location ~ /gamefiles/(?:.*/)?\. { return 404; }
    }

    # ── The UO protocol relay ────────────────────────────────────────────────
    location /ws {
        limit_conn ws_per_ip 4;
        proxy_pass http://uo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;   # an idle player must not be disconnected by nginx
        proxy_send_timeout 3600s;
    }

    # Shared world-map position hub (the World Map rail panel).
    location /uoam {
        limit_conn ws_per_ip 4;
        proxy_pass http://uo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Identity + cloud profile sync (optional: 503s when Discord is unconfigured) ──
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        proxy_pass http://uo_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        proxy_pass http://uo_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin, gated by Discord identity, FAILING CLOSED ─────────────────────
    # 🚨 REACHABILITY IS DECIDED HERE, NOT BY WHERE admin.html SITS. The page is a plain file in
    # the bundle; what keeps it private is this auth_request. It asks the proxy whether the caller
    # is an admin of THIS install, and every non-200 — 401, 403, or the proxy being down — lands on
    # @admin_hidden, which returns a BARE 404. Not 403: a 403 confirms the page exists, and there
    # is no reason to tell a stranger that.
    #
    # Failing closed is the whole point. If the gate cannot be evaluated, the answer is no.
    location = /admin {
        auth_request /__admin_gate;
        error_page 401 403 500 502 503 504 = @admin_hidden;
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        default_type text/html;
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "DENY"        always;
        add_header Referrer-Policy        "no-referrer" always;
    }

    # Belt and braces: the same gate on the raw filename, so /admin.html cannot serve what /admin
    # refuses. Without this the file is still sitting in the document root for anyone who guesses.
    location = /admin.html {
        auth_request /__admin_gate;
        error_page 401 403 500 502 503 504 = @admin_hidden;
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        default_type text/html;
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "DENY"        always;
        add_header Referrer-Policy        "no-referrer" always;
    }

    location @admin_hidden {
        return 404;          # bare, no body: no hint that the location exists at all
    }

    location = /__admin_gate {
        internal;
        # 🚨 THE SAME uo_backend UPSTREAM AS EVERY OTHER PROXIED BLOCK, not a variable.
        #
        # This read `set $admin_upstream proxy:3000; proxy_pass http://$admin_upstream/...`, with a
        # comment arguing a variable avoids nginx refusing to start while the proxy is down. What it
        # actually did was break /admin outright: a variable in proxy_pass defers the hostname to
        # RUNTIME resolution, which requires a `resolver` directive — and there is none in this file.
        # Every subrequest died with "no resolver defined to resolve proxy", nginx logged
        # "auth request unexpected status: 502", error_page sent it to @admin_hidden, and the admin
        # got a bare 404. Indistinguishable from "you are not an admin", which is exactly what it
        # looked like from the outside: the account WAS an admin and /api/admin/gate answered 200 to
        # the browser the whole time. Reported 2026-08-25; found by reading nginx's own error log
        # rather than the config, which looked correct.
        #
        # The trade-off the comment worried about is one every other block in this file already
        # takes, and it is the right one here: if proxy:3000 cannot be resolved, the site is down
        # regardless — an admin page that 404s in that state is not a feature.
        proxy_pass http://uo_backend/api/admin/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Dotfiles: denied before anything else can serve them.
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ── ES modules ───────────────────────────────────────────────────────────
    # 🚨 nginx's stock mime.types has NO mapping for .mjs, so it falls back to
    # application/octet-stream — and the browser refuses a module script served as anything but
    # JavaScript. The .NET runtime ships dotnet.native.worker.<hash>.mjs, so without this the WASM
    # client never starts. The error names a MIME type, which sends you looking at content
    # negotiation rather than at a missing one-line mapping.
    #
    # `types` REPLACES the inherited table rather than extending it, which is why this is a
    # .mjs-only location: doing it in `location /` would drop the mapping for every other
    # extension. And because this block declares add_header of its own, it inherits NONE from the
    # server level — the isolation headers are repeated here deliberately, not by accident.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Referrer-Policy              strict-origin-when-cross-origin always;
        brotli_static on;
        try_files $uri =404;
    }

    # ── The bundle itself ────────────────────────────────────────────────────
    # Fingerprinted assets are immutable by construction (the hash IS the version); index.html and
    # config.json are excluded above, so this cannot pin either.
    location / {
        add_header Cross-Origin-Opener-Policy   same-origin always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Content-Security-Policy   "frame-ancestors 'none'"               always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options       nosniff always;
        add_header Referrer-Policy              strict-origin-when-cross-origin always;
        brotli_static on;
        # =404, never a SPA fallback: a fallback turns a MISSING asset into a 200 serving HTML,
        # which the loader then fails to parse somewhere far from the real cause. That exact trap
        # cost this project a bug report twice.
        try_files $uri $uri/ =404;
    }
}
